[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrotcarriers"
version = "0.1.0"
description = "Cloud-native AR parrot companion — communication bus framework"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[google]>=1.5,<2.0",
    "redis>=7.1,<9.0",
    "python-dotenv>=1.0,<2.0",
    "py-trees>=2.4,<3.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.4,<1.0",
    "httpx>=0.27,<1.0",  # FastAPI TestClient backend (Sprint4 Phase 4 W8)
]
memory = [
    "graphiti-core[falkordb,google-genai]>=0.28,<0.29",
    "rustworkx>=0.15,<1.0",
]
http = [
    # Sprint 3 token_mint + Sprint4 Phase 4 W8 photo_upload_server.
    # Castle docker-compose installs both services from this group.
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]
line_b = [
    # Sprint 4 Phase 5+ Line B (2026-05-04) — STT-LLM-TTS pipeline:
    #   * silero.VAD       — Voice Activity Detector
    #   * google.STT/TTS   — Cloud Speech / TTS (require GOOGLE_APPLICATION_CREDENTIALS)
    #   * google.LLM       — Gemini text API (uses GOOGLE_API_KEY)
    # Line B 默认不开 (PARROT_LLM_PIPELINE=line_a 默认); 装这一组即可 env-gate 切换.
    "livekit-plugins-silero>=1.5,<2.0",
]
voiceprint = [
    # Optional ECS/private owner-speaker verification for LineB.
    # Raw audio and embeddings stay outside Git; this group only installs the
    # local verifier runtime.
    "speechbrain>=1.0,<2.0",
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.26,<3.0",
]
voiceprint_fast = [
    # Lightweight CPU fallback for quick local owner-speaker checks.
    # Resemblyzer is fast and simple, but its own docs note English is its
    # strongest language, so keep SpeechBrain ECAPA as the default for ja/zh.
    "resemblyzer>=0.1.4,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
