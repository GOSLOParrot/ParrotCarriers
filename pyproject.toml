[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrotcarriers"
version = "0.1.0"
description = "Cloud-native AR parrot companion — communication bus framework"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[google]",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
memory = [
    "graphiti-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
