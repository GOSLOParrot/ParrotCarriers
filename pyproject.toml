[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrotcarriers"
version = "0.1.0"
description = "Cloud-native AR parrot companion — communication bus framework"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[google]>=1.5,<2.0",
    "redis>=7.1,<9.0",
    "python-dotenv>=1.0,<2.0",
    "py-trees>=2.4,<3.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.4,<1.0",
    "httpx>=0.27,<1.0",  # FastAPI TestClient backend (Sprint4 Phase 4 W8)
]
memory = [
    "graphiti-core[falkordb,google-genai]>=0.28,<0.29",
    "rustworkx>=0.15,<1.0",
]
http = [
    # Sprint 3 token_mint + Sprint4 Phase 4 W8 photo_upload_server.
    # Castle docker-compose installs both services from this group.
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
