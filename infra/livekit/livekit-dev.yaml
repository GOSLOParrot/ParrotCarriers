# LiveKit Server 配置 — 本地开发环境
# 与 docker-compose.dev.yml 配套使用

port: 7880
rtc:
  tcp_port: 7881
  # 本地开发不需要 UDP 端口范围（不穿越 NAT）
  use_external_ip: false

redis:
  address: redis:6379

keys:
  # LiveKit v1.10+ 要求 secret 至少 32 字符；与 ParrotConfig 默认 LIVEKIT_API_SECRET 一致
  devkey: parrot_carriers_local_dev_livekit_secret_key_v1

room:
  empty_timeout: 300
  max_participants: 10

logging:
  level: debug
