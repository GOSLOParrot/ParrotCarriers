# LiveKit Server 配置 — Castle ECS Phase 1
# 文档: https://docs.livekit.io/home/self-hosting/deployment/

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50200
  tcp_port: 7881
  use_external_ip: true

redis:
  # Phase 1 最小部署中使用同 compose 内的 Redis 服务。
  address: redis:6379

keys:
  # Must match LIVEKIT_API_KEY/LIVEKIT_API_SECRET used by token-mint, Brain,
  # Scheduler, and Unity diagnostics. A mismatch here makes LiveKit reject
  # otherwise valid JWTs with 401 invalid token.
  devkey: parrot_carriers_local_dev_livekit_secret_key_v1

room:
  empty_timeout: 300
  max_participants: 10

logging:
  level: info

