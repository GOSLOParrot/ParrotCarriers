# ParrotCarriers Castle 部署 — Phase 1
# 用法: docker compose -f infra/docker-compose.yml up -d
# 目标: Castle ECS (2C8G, 东京 ecs.g9i.large)
#
# 端口策略 (来自 bus-deploy-livekit-ecs skill):
#   对外暴露: 7880(HTTP/WS信令), 7881(WebRTC TCP), 50000-50200/udp(WebRTC媒体)
#   仅内网:  6379(Redis), 7687(Neo4j Bolt), 7474(Neo4j Browser)

services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"              # HTTP/WebSocket — 信令
      - "7881:7881"              # WebRTC TCP Fallback
      - "50000-50200:50000-50200/udp"  # WebRTC 媒体传输 (匹配 livekit.yaml port_range)
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis 绑定 127.0.0.1 — 宿主机 Python 进程可达，但不暴露到公网
    # (见 bus-deploy-livekit-ecs skill §3.1)
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Phase 2: Neo4j for Graphiti
  # neo4j:
  #   image: neo4j:5-community
  #   expose:
  #     - "7687"   # Bolt — 仅内网
  #     - "7474"   # Browser — 仅内网
  #   environment:
  #     NEO4J_AUTH: neo4j/parrot_memory_2026
  #     NEO4J_server_memory_heap_initial__size: 512m
  #     NEO4J_server_memory_heap_max__size: 1g
  #     NEO4J_server_memory_pagecache_size: 256m
  #   volumes:
  #     - neo4j_data:/data
  #   restart: unless-stopped

volumes:
  redis_data:
