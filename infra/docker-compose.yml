# ParrotCarriers Castle 部署 — Phase 1
# 用法: docker compose -f infra/docker-compose.yml up -d
# 目标: Castle ECS (2C8G, 东京 ecs.g9i.large)
#
# 端口策略 (来自 bus-deploy-livekit-ecs skill):
#   对外暴露: 7880(HTTP/WS信令), 7881(WebRTC TCP), 50000-50200/udp(WebRTC媒体)
#   仅内网:  6379(Redis), 6380(FalkorDB)

services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"              # HTTP/WebSocket — 信令
      - "7881:7881"              # WebRTC TCP Fallback
      - "50000-50200:50000-50200/udp"  # WebRTC 媒体传输 (匹配 livekit.yaml port_range)
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis 绑定 127.0.0.1 — 宿主机 Python 进程可达，但不暴露到公网
    # (见 bus-deploy-livekit-ecs skill §3.1)
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Phase 2: FalkorDB for Graphiti (replaces Neo4j — fits 2C8G constraint)
  # FalkorDB uses Redis protocol on a SEPARATE port to avoid clashing with the main Redis.
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6380:6379"   # Expose as 6380 on host; 6379 is taken by main Redis
    volumes:
      - falkordb_data:/data
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --loadmodule /FalkorDB/bin/linux-x64-release/src/falkordb.so
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
  falkordb_data:
