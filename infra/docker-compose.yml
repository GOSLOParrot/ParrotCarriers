# ParrotCarriers Castle 部署 — Phase 1
# 用法: docker compose -f infra/docker-compose.yml up -d
# 目标: Castle ECS (2C8G, 东京 ecs.g9i.large)
#
# 端口策略 (来自 bus-deploy-livekit-ecs skill):
#   对外暴露: 7880(HTTP/WS信令), 7881(WebRTC TCP), 50000-50200/udp(WebRTC媒体)
#   仅内网:  6379(Redis), 6380(FalkorDB)

services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"              # HTTP/WebSocket — 信令
      - "7881:7881"              # WebRTC TCP Fallback
      - "50000-50200:50000-50200/udp"  # WebRTC 媒体传输 (匹配 livekit.yaml port_range)
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis 绑定 127.0.0.1 — 宿主机 Python 进程可达，但不暴露到公网
    # (见 bus-deploy-livekit-ecs skill §3.1)
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Phase 2: FalkorDB for Graphiti (replaces Neo4j — fits 2C8G constraint)
  # FalkorDB uses Redis protocol on a SEPARATE port to avoid clashing with the main Redis.
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6380:6379"   # Expose as 6380 on host; 6379 is taken by main Redis
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      - REDIS_ARGS=--maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Sprint 3 T-P4: Token Mint service (LiveKit room token generation for Unity)
  #
  # Port 7888: bound to 0.0.0.0 so both the host's local process AND the phone
  # (Unity on IQOO NEO9) can POST to http://<castle-public-ip>:7888/mint.
  #
  # Security model (D3):
  #   - Bearer PARROT_MINT_SECRET header required (Unity reads from Resources/parrot_config.json)
  #   - Alibaba Cloud security group must also allow TCP inbound on port 7888
  #     (Castle ECS 东京节点 → 安全组规则 → 入方向 TCP 7888 放通)
  #   - If tighter isolation is needed later, add Nginx auth_request proxy
  #
  # Dev-mode: if PARROT_MINT_SECRET is unset the service logs a warning and
  # accepts unauthenticated requests — acceptable for local LAN testing.
  token-mint:
    build:
      context: ..
      dockerfile: infra/Dockerfile.brain
      target: base
    command: python -m parrot.castle.token_mint
    env_file:
      - ../.env
    environment:
      - PARROT_MINT_PORT=7888
    ports:
      - "0.0.0.0:7888:7888"   # expose to phone (was 127.0.0.1 — blocked phone access)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Phase 2 ECS Orchestrator — control plane for Tier-routed setting
  # changes and process restart. Bound to 127.0.0.1 because Castle
  # security group should not expose the orchestrator publicly; access
  # via SSH tunnel or in-cluster client.
  #
  # When Phase 3.3 lands, this container also needs `/var/run/docker.sock`
  # mounted in (so it can drive `docker compose`) and either D-Bus or a
  # privileged sidecar to invoke systemctl. Today (Phase 3.1) the
  # systemctl path requires the orchestrator to run on the host directly,
  # so this docker-compose service is convenient for dev / Web monitor
  # use only.
  orchestrator:
    profiles: ["orchestrator", "all"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.brain
      target: base
    command: python -m parrot.castle.orchestrator
    env_file:
      - ../.env
    environment:
      - PARROT_ORCH_HOST=0.0.0.0
      - PARROT_ORCH_PORT=7890
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:7890:7890"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Phase 3.2 Brain container — profile-gated so the default `up` does
  # not start it (a tmux/systemd Brain is still the recommended path
  # while Phase 3 lands). Run with:
  #   docker compose -f infra/docker-compose.yml --profile brain up -d brain
  brain:
    profiles: ["brain", "all"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.brain
      target: full
    command: python -m parrot.brain.agent dev
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      # Phase 1: Brain pipeline resolves from data/runtime_config.json
      # > BB > env > default. PARROT_LLM_PIPELINE here is a fallback.
      - PARROT_LLM_PIPELINE=${PARROT_LLM_PIPELINE:-line_a}
    volumes:
      # The runtime config file must be writable by the orchestrator
      # (which runs in a sibling container) and readable by Brain. Bind
      # the host data/ dir so both containers see the same file.
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  falkordb_data:
